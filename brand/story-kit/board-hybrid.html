<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Daily board (hybrid: editorial page, deal as an editorial insert) · Stone + Platinum story kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300..700&display=block" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="editorial.css"/>
<style>
/* HYBRID variant of board.html (approved daily, Sep 29): sections 01 and 03 are editorial; section 02 (the deal)
   is one weekly-style row set in an editorial insert card (no browser chrome since Sep 29 evening).
   Editorial art board: the middle card of the Manhattan Minute video. Sections fill in as the voice reaches them;
   tools/build_story.py drives setReveal(). No panel, no bar: type, figures and platinum rules on the stone. */
.bd .sections{top:255px}
.bd .sec:first-child{padding-top:0}   /* no header since Sep 29 night: the 01 label starts at y 255 (IG top safe area) */
.bd .sec{display:grid;grid-template-columns:128px 1fr;column-gap:0;padding:var(--pad,74px) 0;position:relative}
.bd .sec + .sec{border-top:0}
.bd .sec + .sec::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,#7E858C 0%,#AEB4BA 22%,#DDE0E3 42%,#B4BAC0 62%,#9AA1A8 75%,rgba(154,161,168,0) 100%)}
.bd .num{align-self:start;font-family:var(--display);font-weight:300;font-size:96px;line-height:.74;letter-spacing:-.02em;color:var(--slate);
  font-variant-numeric:lining-nums tabular-nums;padding-top:2px}
.bd .body{min-width:0;padding-right:16px}
.bd .seg{display:block;line-height:1;margin-bottom:20px}
/* 01: the discount check */
.bd .statrow{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:baseline}
.bd .stat{font-size:150px;line-height:.8;white-space:nowrap}   /* 65% of the first cut (232): 01 no longer outweighs the deal */
.bd .pre{font-family:var(--display);font-style:italic;font-weight:500;font-size:44px;line-height:1;color:var(--slate)}
.bd .pre[hidden]+.stat{grid-column:1 / -1}
.bd .statcap{grid-column:2;margin-top:12px;font-family:var(--display);font-style:italic;font-weight:500;font-size:42px;line-height:1.05;color:var(--deep)}
.bd .meta{margin-top:24px;font-family:var(--ui);font-size:28px;line-height:1.35;color:var(--meta-stone);text-wrap:balance}
/* 02: one deal */
.bd .addr{font-family:var(--display);font-weight:400;font-size:112px;line-height:.96;letter-spacing:-.015em;color:var(--deep);text-wrap:balance}
.bd .addr + .meta{margin-top:22px}
.bd .aside{margin-top:30px;display:grid;grid-template-columns:40px 1fr;column-gap:18px;align-items:start}
.bd .aside i{display:block;height:1px;margin-top:26px;background:linear-gradient(90deg,#7E858C,#9AA1A8)}
.bd .aside p{font-family:var(--display);font-style:italic;font-weight:500;font-size:42px;line-height:1.14;color:var(--slate);text-wrap:balance}
/* 03: one thing to watch */
.bd .watch{font-family:var(--display);font-weight:400;font-size:70px;line-height:1.02;letter-spacing:-.012em;color:var(--deep);text-wrap:balance}
.bd .watch em{display:block;font-style:italic;font-weight:400;color:var(--deep)}
.bd .watch + .meta{margin-top:22px}
/* 02: ONE ROW LIFTED FROM THE WEEKLY PROPERTY ASSESSMENT PANEL (Raphi, Sep 29 evening). The row is the shared
   signature: same structure, type and proportions as the weekly (band at left; address, neighbourhood and price,
   italic one-line read in the middle; CALL chip at right with an optional italic qualifier). The skin stays daily:
   an editorial insert card (see .ins below; the browser bar was removed Sep 29 evening), and the chip in the newer weekly's ENGRAVED style (thin double-rule box,
   letterspaced serif caps) drawn in platinum and charcoal, the same for all four calls (no green / bronze / red).
   Full width like the weekly (x 64 to 1016); the listing text ends near 796, only the chip sits in the right rail,
   exactly as on the approved weekly. The BAND / LISTING / CALL header is off for a single row (deal.header: true shows it). */
.bd .dealp{position:relative;margin:116px -40px 0 -168px;   /* 116 below the label (was 88; Raphi +15 at phone scale) */
  filter:drop-shadow(0 1px 1px rgba(22,28,40,.10)) drop-shadow(0 14px 18px rgba(22,28,40,.07))}
/* EDITORIAL INSERT (Raphi, Sep 29 evening): no browser chrome. A clipped ivory card that belongs to the printed page:
   platinum hairline border, a thin platinum top rule, the top right corner clipped like a cut-out, and a small
   letterspaced tag (PROPERTY ASSESSMENT, config dealTag) in the top left. Subtle shadow only. */
.bd .dealp .ins{position:relative;background:linear-gradient(180deg,#FBF9F5,#F6F3EE);
  clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%);box-shadow:inset 0 0 0 1px rgba(126,133,140,.55)}
.bd .dealp .ins::before{content:"";position:absolute;top:0;left:0;right:34px;height:2px;
  background:linear-gradient(90deg,#7E858C,#B4BAC0 28%,#DDE0E3 50%,#B4BAC0 72%,#8E959C)}
.bd .dealp .ins::after{content:"";position:absolute;top:0;left:calc(100% - 34px);width:48.2px;height:2px;
  background:linear-gradient(90deg,#8E959C,#B4BAC0);transform-origin:0 0;transform:rotate(45deg)}   /* hairline along the clipped edge */
.bd .dealp .itag{padding:20px 28px 0;line-height:1}
.bd .dealp .itag span{font-family:var(--ui);font-size:14px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--label)}
.bd .dealp .itag span:empty{display:none}
.bd .dealp .thead[hidden],.bd .dealp .who[hidden]{display:none}
.bd .dealp .row{padding-top:16px;padding-bottom:26px}
.bd .dealp .band{font-family:var(--ui);font-size:22px;font-weight:500;line-height:44.8px;color:var(--slate);letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.bd .dealp .meta .sep{color:rgba(42,52,71,.40);padding:0 .42em}
.bd .dealp .call{display:flex;flex-direction:column;align-items:flex-end;margin-top:-1.6px}
.bd .dealp .call small{margin-top:8px;width:176px;text-align:center;font-family:var(--display);font-style:italic;font-weight:500;font-size:23px;line-height:1.2;color:var(--slate)}
.bd .dealp .addr{font-family:var(--ui);font-size:40px;font-weight:600;line-height:1.06;letter-spacing:-.02em;color:var(--deep);text-wrap:balance}
.bd .dealp .meta{margin-top:6px;font-family:var(--ui);font-size:26px;line-height:1.3;color:var(--meta);text-wrap:pretty}
.bd .dealp .meta b.f{font-weight:600;color:var(--deep);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.005em}
.bd .dealp .why{margin-top:8px;font-family:var(--display);font-style:italic;font-weight:500;font-size:35px;line-height:1.08;text-wrap:balance;color:var(--slate)}
.bd .dealp .who{margin-top:10px;display:flex;align-items:baseline;gap:12px;font-family:var(--ui);font-size:22px;line-height:1.3;color:var(--meta)}
.bd .dealp .who .k{flex:0 0 auto;font-size:14px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--label)}
.bd .dealp .who.ph .v,.bd .dealp .call small.ph{color:var(--label)}
/* engraved CALL chip: outer platinum rule, 3px gap, inner charcoal hairline, Cormorant caps */
.bd .dealp .mark{display:flex;align-items:center;justify-content:center;width:176px;height:48px;position:relative;
  background:transparent;box-shadow:none;border-radius:0;text-shadow:none;overflow:visible;
  font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.26em;text-indent:.26em;line-height:1;text-transform:uppercase;color:var(--deep)}
.bd .dealp .mark::before{content:"";position:absolute;inset:0;border:1.5px solid #8E959C;
  border-image:linear-gradient(90deg,#7E858C,#B4BAC0 30%,#DDE0E3 50%,#B4BAC0 70%,#7E858C) 1}
.bd .dealp .mark::after{content:"";position:absolute;inset:4px;border:1px solid rgba(42,52,71,.55)}
.bd .dealp .mark.tbd{color:var(--label)}
.bd .dealp .mark.tbd::after{border-style:dashed;border-color:rgba(74,80,88,.6)}
.bd .dealp .mark.invalid{color:#7A383B}
.bd .dealp .mark.invalid::after{border:2px solid #954245}
.bd .fill{will-change:opacity,transform,filter}
</style>
</head>
<body>
<div id="capture" class="ed bd">
  <div class="col sections" id="sections">
    <section class="sec" data-row="r1">
      <div class="num dim">01</div>
      <div class="body fill" data-part="r1">
        <span class="seg caps" data-slot="r1Label"></span>
        <div class="statrow">
          <span class="pre" data-slot="r1FigurePre" data-optional></span>
          <div class="fig stat" data-slot="r1Figure"></div>
          <div class="statcap" data-slot="r1FigureLabel" data-optional></div>
        </div>
        <div class="meta" data-slot="r1Meta" data-optional data-figures></div>
      </div>
    </section>

    <section class="sec" data-row="r2">
      <div class="num dim">02</div>
      <div class="body">
        <div class="fill" data-part="r2">
          <span class="seg caps" data-slot="r2Label"></span>
          <div class="dealp">
           <div class="ins">
            <div class="itag"><span data-slot="dealTag"></span></div>
            <div class="thead" id="dealHead" hidden><span>Band</span><span>Listing</span><span>Call</span></div>
            <div class="row">
              <div class="band" id="dealBand"></div>
              <div>
                <div class="addr" data-slot="r2"></div>
                <div class="meta" data-slot="r2Meta" data-optional data-figures></div>
                <div class="why fill" data-part="r2Aside" data-slot="r2Aside" data-optional></div>
                <div class="who" id="dealWho" hidden><span class="k">For</span><span class="v"></span></div>
              </div>
              <div class="call" id="dealCall"><span class="mark"></span><small hidden></small></div>
            </div>
           </div>
          </div>
        </div>
      </div>
    </section>

    <section class="sec" data-row="r3">
      <div class="num dim">03</div>
      <div class="body fill" data-part="r3">
        <span class="seg caps" data-slot="r3Label"></span>
        <div class="watch"><span data-slot="r3"></span><em data-slot="r3Accent" data-optional></em></div>
        <div class="meta" data-slot="r3Meta" data-optional data-figures></div>
      </div>
    </section>
  </div>

  <footer class="efoot">   <!-- footer (Raphi, Sep 29 night): AK monogram, website rule, disclaimer, date; no header, no tagline -->
    <img class="mono" src="assets/ak-deep.png" alt="AK"/>
    <div class="divider" role="presentation"><span class="stripe"></span><span class="site">agentkammer.com</span><span class="stripe"></span></div>
    <p class="fine" data-slot="fine"></p>
    <span class="caps date" data-slot="dateLong"></span>
  </footer>
</div>
<script src="kit.js"></script>
<script>
const cfg = applyKitConfig({
  show: "The Manhattan Minute",
  boardAccent: "In this minute",
  r1Label: "The discount check", r1FigurePre: "", r1Figure: "", r1FigureLabel: "", r1Meta: "",
  r2Label: "One deal", r2: "", r2Meta: "", r2Aside: "", dealTag: "Property assessment",
  r3Label: "One thing to watch", r3: "", r3Accent: "", r3Meta: "",
  tagline: "Live where you belong.",
  fine: "Educational commentary. Not advice. Opinions of Raphael Kammer."
});
// Figures in meta lines ($15M, 14%, 17) set 600 deep tabular.
document.querySelectorAll('[data-figures]').forEach(el => {
  if (el.hidden) return;
  const t = el.textContent; el.textContent = '';
  t.split(/(\$?\d[\d,.]*(?:\s?(?:%|M|K|B)\b|%)?)/).forEach((s, i) => {
    if (!s) return;
    if (i % 2) { const b = document.createElement('b'); b.className = 'f'; b.textContent = s; el.appendChild(b); }
    else el.appendChild(document.createTextNode(s));
  });
});
// 02 verdict row (weekly Property Assessment labeling). Config: deal = { band, area, price, verdict, qualifier, who, header }.
// verdict must be Pick, Consider, Wait or Pass (build_story.py refuses anything else). "placeholder" renders a
// clearly labelled grey TBD chip for layout review only; empty hides the chip. who = the one lifestyle WHO line.
(function(){
  const d = cfg.deal || {}, VERDICTS = ['pick', 'consider', 'wait', 'pass'];
  document.getElementById('dealBand').textContent = d.band || '';
  if (d.area || d.price) {   // weekly meta line: neighbourhood · price (replaces r2Meta when given)
    const m = document.querySelector('.dealp .meta'); m.hidden = false; m.textContent = '';
    if (d.area) m.appendChild(document.createTextNode(d.area));
    if (d.area && d.price) { const sp = document.createElement('span'); sp.className = 'sep'; sp.setAttribute('aria-hidden', 'true'); sp.textContent = '\u00B7'; m.appendChild(sp); }
    if (d.price) { const b = document.createElement('b'); b.className = 'f'; b.textContent = d.price; m.appendChild(b); }
  }
  document.getElementById('dealHead').hidden = !d.header;
  const call = document.getElementById('dealCall'), mark = call.querySelector('.mark'), small = call.querySelector('small');
  const v = String(d.verdict || '').trim().toLowerCase();
  if (VERDICTS.includes(v)) { mark.className = 'mark ' + v; mark.textContent = v[0].toUpperCase() + v.slice(1); }
  else if (v === 'placeholder') { mark.className = 'mark tbd'; mark.textContent = 'TBD'; small.classList.add('ph'); small.textContent = 'layout placeholder'; small.hidden = false; }
  else if (!v) call.hidden = true;
  else { mark.className = 'mark invalid'; mark.textContent = 'Invalid'; (window.BOARD_ERRORS = window.BOARD_ERRORS || []).push('deal.verdict must be Pick, Consider, Wait or Pass, got ' + JSON.stringify(d.verdict)); }
  if (d.qualifier && v !== 'placeholder') { small.textContent = d.qualifier; small.hidden = false; }
  const who = document.getElementById('dealWho');
  if (d.who) { who.hidden = false; const ph = String(d.who).trim().toLowerCase() === 'placeholder';
    who.classList.toggle('ph', ph); who.querySelector('.v').textContent = ph ? 'placeholder, WHO not assessed yet' : d.who; }
})();
// Fit. Width: a long key figure shrinks until the figure row stays inside x=960.
// Height: tighten section padding (74 -> 20px in the hybrid), then scale the display sizes down in 5% steps (to 80%),
// until the sections end above the 1560 safe line. window.BOARD_FIT reports the result (read by build_story.py).
window.fitBoard = function(){
  const box = document.getElementById('sections');
  const big = [...document.querySelectorAll('.stat,.addr,.watch')];
  big.forEach(e => { e.style.fontSize = ''; e.dataset.base = parseFloat(getComputedStyle(e).fontSize); });
  const row = document.querySelector('.statrow'), stat = document.querySelector('.stat');
  let fw = 1;
  const rowRight = () => Math.max(...[...row.children].filter(c => !c.hidden).map(c => c.getBoundingClientRect().right));
  while (rowRight() > 960 && fw > 0.4) { fw = +(fw - 0.04).toFixed(2); stat.style.fontSize = (stat.dataset.base * fw) + 'px'; }
  stat.dataset.base = stat.dataset.base * fw;
  let pad = 74, scale = 1, bottom;   // 74 since the no-header layout (was 62): the freed height balances the rhythm
  for (;;) {
    box.style.setProperty('--pad', pad + 'px');
    big.forEach(e => { e.style.fontSize = (e.dataset.base * scale) + 'px'; });
    bottom = box.getBoundingClientRect().bottom - pad;   // last section's bottom padding is air, not content
    if (bottom <= 1560) break;
    if (pad > 20) pad = Math.max(20, pad - 4); else if (scale > 0.8) scale = +(scale - 0.05).toFixed(2); else break;
  }
  return window.BOARD_FIT = { rowPadding: pad, scale, figureScale: fw, keyBottom: Math.round(bottom), ok: bottom <= 1560 };
};
fitBoard(); document.fonts.ready.then(fitBoard);

// Reveal control: progress 0..1 per part (r1, r2, r2Aside, r3), eased (ease-out cubic).
// Ink settle: content fades in with a 20px rise and a 7px blur that sharpens to nothing. The section numeral waits at 22% and comes up with its section.
window.BOARD_PARTS = [...document.querySelectorAll('[data-part]')].filter(e => !e.hidden).map(e => e.dataset.part);
const ease = p => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
window.setReveal = function(prog){
  document.querySelectorAll('[data-part]').forEach(el => {
    const e = ease(prog[el.dataset.part] ?? 1);
    el.style.opacity = e.toFixed(4); el.style.transform = `translateY(${((1 - e) * 20).toFixed(2)}px)`;
    el.style.filter = e >= 0.999 ? 'none' : `blur(${((1 - e) * 7).toFixed(2)}px)`;   // ink settling: soft to sharp
  });
  document.querySelectorAll('[data-row]').forEach(row => {
    const e = ease(prog[row.dataset.row] ?? 1);
    row.querySelectorAll('.dim').forEach(d => d.style.opacity = (0.22 + 0.78 * e).toFixed(4));
  });
};
(function(){
  const r = (new URLSearchParams(location.search).get('reveal') || cfg.reveal || 'all');
  const prog = {};
  if (r === 'none') BOARD_PARTS.forEach(p => prog[p] = 0);
  else if (r !== 'all') r.split(',').forEach(kv => { const [k, v] = kv.split(':'); prog[k] = parseFloat(v); });
  setReveal(prog);
})();
</script>
</body>
</html>
