<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>The Manhattan Minute, Agent Kammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300..700&display=block" rel="stylesheet"/>
<style>
/* Daily one page brief, US Letter (816 x 1056 CSS px), Stone + Platinum. Rendered by tools/build_brief.py.
   Every number comes from the day's config (cover facts from tools/cover_facts.py, script facts from the board slots)
   or from the Negotiation Compass CSV, which build_brief.py turns into cfg.compass. Nothing here invents a value. */
@page{size:8.5in 11in;margin:0}
:root{--deep:#161C28;--navy:#2A3447;--slate:#555C69;--label:#4A5058;--meta-stone:#454B55;--plat-ink:#7E858C;
  --display:"Cormorant Garamond",Georgia,serif;--ui:Inter,"Helvetica Neue",Arial,sans-serif;--L:64px;--R:64px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#CFCCC6}
#capture{width:816px;height:1056px;position:relative;overflow:hidden;color:var(--deep);font-family:var(--ui);
  background:#CFCCC6 url(assets/stone-bg.png) 0 -120px/816px auto no-repeat;
  font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;-webkit-font-smoothing:antialiased;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
#capture::before{content:"";position:absolute;inset:22px;border-radius:3px;padding:1.5px;pointer-events:none;
  background:linear-gradient(135deg,#7E858C 0%,#C9CED3 22%,#EEF0F2 42%,#9AA1A8 60%,#7E858C 80%,#C9CED3 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
#capture::after{content:"";position:absolute;inset:28px;border-radius:2px;border:1px solid rgba(238,240,242,.55);box-shadow:0 0 0 1px rgba(126,133,140,.16);pointer-events:none}
.page{position:absolute;left:var(--L);right:var(--R);top:48px;bottom:44px;display:flex;flex-direction:column}
.prule{display:block;height:1px;background:linear-gradient(90deg,#7E858C 0%,#AEB4BA 22%,#DDE0E3 45%,#B4BAC0 65%,#9AA1A8 82%,#7E858C 100%)}
.prule.heavy{height:2px}
.dbl{display:flex;flex-direction:column;gap:3px}
.caps{font-family:var(--ui);font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--label);line-height:1}
.ital{font-family:var(--display);font-style:italic;font-weight:500;color:var(--slate)}
b.f{font-weight:600;color:var(--deep);font-variant-numeric:tabular-nums lining-nums}

/* Masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:10px}
.mast .plate{font-family:var(--display);font-weight:400;font-size:46px;line-height:.9;letter-spacing:-.01em;color:var(--deep)}
.mast .plate i{font-style:italic}
.mast .brand{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.mast .brand img{width:22px;height:auto;display:block}
.runhead{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 0}
.runhead .ital{font-size:17px;line-height:1;color:var(--navy)}

/* Cover facts strip */
.facts{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(252,252,251,.72);border-radius:3px;position:relative;
  box-shadow:0 1px 2px rgba(22,28,40,.05),0 6px 16px rgba(22,28,40,.06)}
.facts::before{content:"";position:absolute;inset:0;border-radius:3px;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,#7E858C 0%,#B4BAC0 22%,#EEF0F2 45%,#B4BAC0 68%,#7E858C 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.fx{padding:12px 16px 12px 18px;position:relative}
.fx + .fx::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px;background:#B4BAC0}
.fx .v{margin-top:8px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fx .v b{font-family:var(--display);font-weight:500;font-size:26px;line-height:1;color:var(--deep);font-variant-numeric:lining-nums tabular-nums}
.fx .v i{font-family:var(--display);font-style:italic;font-weight:500;font-size:16px;color:var(--navy)}
.fx .v small{font-size:10.5px;font-weight:500;color:var(--meta-stone);line-height:1.25}
.fx .v small .d{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--deep)}
.fx .v small svg{width:7px;height:6px;fill:var(--navy)}
.wxi{width:28px;height:28px;flex:0 0 auto;stroke:var(--navy);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Sections */
.sec{display:grid;grid-template-columns:56px 1fr;padding-top:24px;margin-top:24px;position:relative}
.sec::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,#7E858C,#B4BAC0 40%,#DDE0E3 70%,rgba(154,161,168,.2))}
.sec.first::before{display:none}
.sec .num{font-family:var(--display);font-weight:400;font-size:34px;line-height:.8;color:var(--navy);font-variant-numeric:lining-nums tabular-nums}
.sec .lab{display:block;margin-bottom:10px}
.stat{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.stat .pre{font-family:var(--display);font-style:italic;font-weight:500;font-size:24px;color:var(--slate)}
.stat .fig{font-family:var(--display);font-weight:400;font-size:66px;line-height:.85;letter-spacing:-.02em;color:var(--deep);font-variant-numeric:lining-nums tabular-nums}
.stat .cap{font-family:var(--display);font-style:italic;font-weight:500;font-size:24px;color:var(--deep)}
.meta{margin-top:8px;font-size:12.5px;line-height:1.45;color:var(--meta-stone)}

/* Negotiation Compass table */
.compass{margin-top:16px}
.compass .th{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.compass .th .t{font-family:var(--display);font-weight:500;font-size:19px;color:var(--deep)}
.compass .th .t i{font-style:italic}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums}
thead th{font-family:var(--ui);font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--label);text-align:right;padding:8px 0 7px;border-bottom:1px solid #9AA1A8}
thead th:first-child{text-align:left}
tbody td{padding:11px 0 10px;border-bottom:1px solid rgba(126,133,140,.38);font-size:13px;color:var(--deep);text-align:right;white-space:nowrap}
tbody td:first-child{text-align:left;font-family:var(--display);font-size:18px;font-weight:500}
tbody td.thin{text-align:center;font-family:var(--display);font-style:italic;font-size:16px;font-weight:500;color:var(--slate)}
tbody td .u{font-size:10.5px;color:var(--meta-stone);margin-left:3px}
.compass .note{margin-top:7px;font-size:10px;line-height:1.45;color:var(--meta-stone)}

/* Deal */
.addr{font-family:var(--display);font-weight:400;font-size:36px;line-height:1;letter-spacing:-.01em;color:var(--deep)}
.take{margin-top:12px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline}
.take .caps{font-size:8.5px}
.take p{font-family:var(--display);font-style:italic;font-weight:500;font-size:19px;line-height:1.2;color:var(--slate)}
.watch{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;color:var(--deep)}
.watch em{font-style:italic}

/* Footer */
.foot{margin-top:auto}
.sources{font-size:9.5px;line-height:1.5;color:var(--meta-stone)}
.sources b{font-weight:600;color:var(--label);letter-spacing:.16em;text-transform:uppercase;font-size:8.5px;margin-right:6px}
.divider{margin-top:12px;display:flex;align-items:center}
.stripe{flex:1 1 0;height:11px;background-image:repeating-linear-gradient(90deg,rgba(42,52,71,.22) 0 1px,transparent 1px 5px)}
.site{padding:0 14px;font-size:10px;font-weight:600;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;color:var(--deep);line-height:1}
.endline{margin-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.endline .tag{font-family:var(--display);font-style:italic;font-weight:500;font-size:15px;color:var(--deep)}
.endline .fine{font-size:9px;color:var(--meta-stone)}
</style>
</head>
<body>
<div id="capture">
 <div class="page">
  <header>
    <div class="mast">
      <div class="plate"><span data-slot="plateThe"></span> <span data-slot="plate1"></span> <i data-slot="plate2"></i></div>
      <div class="brand"><img src="assets/ak-deep.png" alt="AK"/><span class="caps" data-slot="coverKicker"></span></div>
    </div>
    <div class="dbl"><span class="prule heavy"></span><span class="prule"></span></div>
    <div class="runhead"><span class="caps" data-slot="dateLong"></span><span class="ital" data-slot="briefRight"></span></div>
  </header>

  <section class="facts" id="facts">
    <div class="fx wx" data-show-if="wxHigh"><span class="caps" data-slot="wxLabel"></span>
      <div class="v"><svg class="wxi" id="wxIcon" viewBox="0 0 44 44" aria-hidden="true"></svg><b id="wxTemps"></b><i data-slot="wxCond" data-optional></i></div></div>
    <div class="fx t10" data-show-if="t10Yield"><span class="caps" data-slot="t10Label"></span>
      <div class="v"><b data-slot="t10Yield"></b><small><span class="d" id="t10Chg"></span><span id="t10AsOf"></span></small></div></div>
    <div class="fx sun" data-show-if="sunset"><span class="caps" data-slot="sunsetLabel"></span><div class="v"><b data-slot="sunset"></b></div></div>
  </section>

  <section class="sec first">
    <div class="num">01</div>
    <div>
      <span class="caps lab" data-slot="r1Label"></span>
      <div class="stat" data-show-if="r1Figure"><span class="pre" data-slot="r1FigurePre" data-optional></span><span class="fig" data-slot="r1Figure"></span><span class="cap" data-slot="r1FigureLabel" data-optional></span></div>
      <div class="meta" data-slot="r1Meta" data-optional data-figures></div>
      <div class="compass">
        <div class="th"><span class="t">Negotiation <i>Compass</i></span><span class="caps" data-slot="compassWindow" data-optional></span></div>
        <table>
          <colgroup><col style="width:31%"/><col style="width:24%"/><col style="width:27%"/><col style="width:18%"/></colgroup>
          <thead><tr><th>Band</th><th>Median vs last ask</th><th>Median vs original ask</th><th>Matched sales</th></tr></thead>
          <tbody id="compassRows"></tbody>
        </table>
        <p class="note" id="compassNote"></p>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="num">02</div>
    <div>
      <span class="caps lab" data-slot="r2Label"></span>
      <div class="addr" data-slot="r2"></div>
      <div class="meta" data-slot="r2Meta" data-optional data-figures></div>
      <div class="take" data-show-if="r2Aside"><span class="caps" data-slot="takeLabel"></span><p data-slot="r2Aside"></p></div>
    </div>
  </section>

  <section class="sec">
    <div class="num">03</div>
    <div>
      <span class="caps lab" data-slot="r3Label"></span>
      <div class="watch"><span data-slot="r3"></span> <em data-slot="r3Accent" data-optional></em></div>
      <div class="meta" data-slot="r3Meta" data-optional data-figures></div>
    </div>
  </section>

  <footer class="foot">
    <p class="sources"><b>Sources</b><span data-slot="briefSources"></span></p>
    <div class="divider" role="presentation"><span class="stripe"></span><span class="site">agentkammer.com</span><span class="stripe"></span></div>
    <div class="endline"><span class="tag" data-slot="tagline"></span><span class="fine" data-slot="fine"></span></div>
  </footer>
 </div>
</div>
<script src="kit.js"></script>
<script src="wx-icons.js"></script>
<script>
const cfg = applyKitConfig({
  plateThe: "The", plate1: "Manhattan", plate2: "Minute", coverKicker: "Agent Kammer",
  briefRight: "Today\u2019s full brief, one page",
  wxLabel: "NYC weather", t10Label: "10 yr Treasury", sunsetLabel: "Sunset",
  r1Label: "The discount check", r2Label: "One deal", r3Label: "One thing to watch", takeLabel: "The Kammer take",
  compassWindow: "",
  briefSources: "ACRIS via NYC Open Data; StreetEasy and Compass listing tracking; National Weather Service (api.weather.gov); FRED and U.S. Treasury daily par yield curve.",
  tagline: "Live where you belong.",
  fine: "Educational commentary. Not advice. Opinions of Agent Kammer / Raphael Kammer."
});
document.title = `The Manhattan Minute, Agent Kammer, ${cfg.mdy}`;   // becomes the PDF Title metadata
// Figures in meta lines: bold $ amounts, percentages and counts (same rule as the board)
document.querySelectorAll('[data-figures]').forEach(el => {
  if (!el.textContent) return;
  el.innerHTML = el.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(\$[\d.,]+[MKB]?|\d[\d.,]*%|\b\d+\b)/g, '<b class="f">$1</b>');
});
if (cfg.wxHigh && cfg.wxLow) document.getElementById('wxTemps').textContent = cfg.wxHigh + '\u00B0 / ' + cfg.wxLow + '\u00B0';
else document.querySelector('.fx.wx').hidden = true;
const ic = (window.WX_ICONS || {})[cfg.wxIcon]; if (ic) document.getElementById('wxIcon').innerHTML = ic; else document.getElementById('wxIcon').remove();
(function(){
  const bp = cfg.t10ChangeBp, el = document.getElementById('t10Chg');
  if (bp === null || bp === undefined || bp === '') el.remove();
  else if (+bp === 0) el.textContent = 'Unchanged';
  else el.innerHTML = (+bp > 0 ? '<svg viewBox="0 0 10 9"><path d="M5 0l5 9H0z"/></svg>' : '<svg viewBox="0 0 10 9"><path d="M0 0h10L5 9z"/></svg>') + Math.abs(+bp) + ' bp';
  const as = document.getElementById('t10AsOf'); if (cfg.t10AsOfLabel) as.textContent = cfg.t10AsOfLabel + ' close'; else as.remove();
})();
if (![...document.querySelectorAll('.fx')].some(e => !e.hidden)) document.getElementById('facts').hidden = true;
// Negotiation Compass rows come from build_brief.py (cfg.compass). A row without enough matched sales says so.
(function(){
  const rows = Array.isArray(cfg.compass) ? cfg.compass : [], tb = document.getElementById('compassRows');
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const pct = v => { const n = +v; if (Math.abs(n) < 0.05) return 'At ask';
    return Math.abs(n).toFixed(1) + '%<span class="u">' + (n < 0 ? 'under' : 'over') + '</span>'; };   // magnitude + word, never a minus sign
  tb.innerHTML = rows.map(r => {
    if (r.thin) return `<tr><td>${esc(r.band)}</td><td class="thin" colspan="2">Too thin to call</td><td>${r.matched == null ? '<span class="u">none on file</span>' : r.matched}</td></tr>`;
    return `<tr><td>${esc(r.band)}</td><td>${pct(r.vsLast)}</td><td>${pct(r.vsOrig)}</td><td>${r.matched}</td></tr>`;
  }).join('');
  const min = cfg.compassMinSales || 5;
  document.getElementById('compassNote').textContent = cfg.compassNote ||
    `Median sale price against last and original asking price, by price band. Too thin to call: fewer than ${min} matched sales.`;
})();
</script>
</body>
</html>
