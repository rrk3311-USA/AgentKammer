<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Daily board, panel version (superseded by the editorial board.html) · Stone + Platinum story kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300..700&display=block" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<style>
/* Daily board: the middle card of the Manhattan Minute video. Same frame, header, panel and footer as cover.html.
   Each row's content fills in (fade + 16px rise) when its script line starts; tools/build_story.py drives setReveal(). */
.board .title{top:258px;font-size:112px}
.board .panel{top:440px}
.board .thead,.board .row{grid-template-columns:92px 1fr}
.board .row{padding-top:52px;padding-bottom:52px;padding-right:56px}   /* text column ends at x=960 */
.board .num{font-size:22px;font-weight:500;line-height:22px;color:var(--slate);letter-spacing:.02em;font-variant-numeric:tabular-nums lining-nums}
.board .seg{font-size:16px;line-height:22px;letter-spacing:.24em;color:var(--label)}
.board .addr{margin-top:16px;font-size:44px;text-wrap:balance}
.board .meta{margin-top:10px;text-wrap:balance}
.board .meta b{font-weight:600;color:var(--deep);font-variant-numeric:tabular-nums lining-nums}
.board .why{margin-top:18px;font-size:36px}
.board .fill{will-change:opacity,transform}
.board .note{top:auto}
/* QR removed kit-wide (Raphi, Sep 29): footer is tagline + small print, centred */
.fbody{grid-template-columns:1fr}
.ftext{height:auto;justify-content:flex-start;text-align:center}
.ftext .fine{margin-top:14px;text-align:center}
/* Footer block moved down 125px as a unit (Sep 30, Raphi: the footer sits low): divider 1721, tagline and small print
   from 1790, small print ending at 1860. */
#capture.board .divider{top:1721px}
#capture.board .fbody{top:1790px}
</style>
</head>
<body>
<div id="capture" class="board">
  <header class="mast">
    <img src="assets/ak-deep.png" alt="AK"/>
    <div class="kicker" data-slot="show"></div>
    <span class="rule"></span>
  </header>

  <h1 class="title"><span data-slot="boardHeadline"></span> <em data-slot="boardAccent"></em></h1>

  <section class="panel">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="t"><b data-slot="show"></b><span class="sep">·</span><span data-slot="dateShort"></span></div>
      <img class="r" src="assets/ak-deep.png" alt=""/>
    </div>
    <div class="thead"><span data-slot="boardColA"></span><span data-slot="boardColB"></span></div>

    <div class="row" data-row="r1">
      <div class="num dim">01</div>
      <div>
        <div class="seg label dim" data-slot="r1Label"></div>
        <div class="fill" data-part="r1">
          <div class="addr" data-slot="r1"></div>
          <div class="meta" data-slot="r1Meta" data-optional data-figures></div>
        </div>
      </div>
    </div>

    <div class="row" data-row="r2">
      <div class="num dim">02</div>
      <div>
        <div class="seg label dim" data-slot="r2Label"></div>
        <div class="fill" data-part="r2">
          <div class="addr" data-slot="r2"></div>
          <div class="meta" data-slot="r2Meta" data-optional data-figures></div>
        </div>
        <div class="fill why" data-part="r2Aside" data-slot="r2Aside" data-optional></div>
      </div>
    </div>

    <div class="row" data-row="r3">
      <div class="num dim">03</div>
      <div>
        <div class="seg label dim" data-slot="r3Label"></div>
        <div class="fill" data-part="r3">
          <div class="addr" data-slot="r3"></div>
          <div class="meta" data-slot="r3Meta" data-optional data-figures></div>
        </div>
      </div>
    </div>
  </section>

  <section class="note" id="bnote" data-show-if="boardNote">
    <div class="k label"><i></i><span data-slot="boardNoteLabel"></span></div>
    <p data-slot="boardNote"></p>
  </section>

  <div class="divider" role="presentation"><span class="stripe"></span><span class="site">agentkammer.com</span><span class="stripe"></span></div>
  <footer class="fbody">
    <div class="ftext">
      <span class="tag" data-slot="tagline"></span>
      <p class="fine" data-slot="fine"></p>
    </div>
  </footer>
</div>
<script src="kit.js"></script>
<script>
const cfg = applyKitConfig({
  show: "The Manhattan Minute",
  boardHeadline: "In this",
  boardAccent: "minute",
  boardColA: "Part",
  boardColB: "Today",
  r1Label: "The discount check",
  r1: "", r1Meta: "",
  r2Label: "One deal",
  r2: "", r2Meta: "", r2Aside: "",
  r3Label: "One thing to watch",
  r3: "", r3Meta: "",
  boardNoteLabel: "Note",
  boardNote: "",
  tagline: "Live where you belong.",
  fine: "Educational commentary. Not advice. Opinions of Raphael Kammer."
});
// Figures in meta lines ($15M, 14%, 17) render 600 deep tabular, like prices on the weekly card.
document.querySelectorAll('[data-figures]').forEach(el => {
  if (el.hidden) return;
  const t = el.textContent; el.textContent = '';
  t.split(/(\$?\d[\d,.]*(?:\s?(?:%|M|K|B)\b|%)?)/).forEach((s, i) => {
    if (!s) return;
    if (i % 2) { const b = document.createElement('b'); b.textContent = s; el.appendChild(b); }
    else el.appendChild(document.createTextNode(s));
  });
});
// Fit: on long copy days, tighten row padding (52 -> 32px) until the panel, and the optional note 49px
// under it, end above the 1560 safe line. window.BOARD_FIT reports the result (read by build_story.py).
window.fitBoard = function(){
  const panel = document.querySelector('.panel'), note = document.getElementById('bnote'), rows = document.querySelectorAll('.row');
  let pad = 52, bottom;
  for (;;) {
    rows.forEach(r => { r.style.paddingTop = r.style.paddingBottom = pad + 'px'; });
    const pb = panel.getBoundingClientRect().bottom;
    note.style.top = Math.round(pb + 49) + 'px';
    bottom = note.hidden ? pb : note.getBoundingClientRect().bottom;
    if (bottom <= 1560 || pad <= 32) break;
    pad -= 4;
  }
  return window.BOARD_FIT = { rowPadding: pad, keyBottom: Math.round(bottom), ok: bottom <= 1560 };
};
fitBoard(); document.fonts.ready.then(fitBoard);   // re-measure once the web fonts are in

// Reveal control. progress 0..1 per part (r1, r2, r2Aside, r3), eased here (ease-out cubic).
// Content: opacity 0 -> 1 and a 16px rise. Row number + section label: 42% -> 100% with the row's main part.
window.BOARD_PARTS = [...document.querySelectorAll('[data-part]')].filter(e => !e.hidden).map(e => e.dataset.part);
const ease = p => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
window.setReveal = function(prog){
  document.querySelectorAll('[data-part]').forEach(el => {
    const e = ease(prog[el.dataset.part] ?? 1);
    el.style.opacity = e.toFixed(4); el.style.transform = `translateY(${((1 - e) * 16).toFixed(2)}px)`;
  });
  document.querySelectorAll('[data-row]').forEach(row => {
    const e = ease(prog[row.dataset.row] ?? 1);
    row.querySelectorAll('.dim').forEach(d => d.style.opacity = (0.42 + 0.58 * e).toFixed(4));
  });
};
// URL: board.html?reveal=none | all (default) | r1:1,r2:0.5
(function(){
  const r = (new URLSearchParams(location.search).get('reveal') || cfg.reveal || 'all');
  const prog = {};
  if (r === 'none') BOARD_PARTS.forEach(p => prog[p] = 0);
  else if (r !== 'all') r.split(',').forEach(kv => { const [k, v] = kv.split(':'); prog[k] = parseFloat(v); });
  setReveal(prog);
})();
</script>
</body>
</html>
